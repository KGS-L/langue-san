version: 1

sources:
  asjp:
    name: "The ASJP Database"
    type: "structured_dataset"
    homepage: "https://asjp.clld.org/"
    release: "https://zenodo.org/records/16736409"
    version: "v21"
    repository: "https://github.com/lexibank/asjp/tree/v21"
    license: "CC-BY-4.0"
    enabled: true
    status: "approved_for_ingestion"
    intended_use: "lexical_reference"
    wordlists:
      - variety: "maka"
        iso_639_3: "sbd"
        asjp_id: "SOUTHERN_SAMO_SAN"
      - variety: "matya"
        iso_639_3: "stj"
        asjp_id: "SAMO_MATYA_2"
      - variety: "maya"
        iso_639_3: "sym"
        asjp_id: "MAYA_SAMO"

  ainsisoisje:
    name: "Ainsi sois-je — Dictionnaire Français / Samo"
    type: "web_dictionary"
    homepage: "https://ainsisoisje.com/"
    resource: "https://ainsisoisje.com/dictionnaire-samo-francais/"
    license: "All Rights Reserved"
    enabled: false
    status: "rights_review_required"
    intended_use: "local_source_inventory_and_comparison_only"
    declared_entry_count: 126
    variety: "unknown"
    iso_639_3: null
    publication_approved: false
    training_approved: false
    notes:
      - "La page publique ne précise pas la variété Samo au niveau ISO."
      - "Aucune attribution automatique vers sbd, stj ou sym."
      - "Le RAW reste local tant que les droits de réutilisation ne sont pas clarifiés."

  huggingface:
    name: "Hugging Face datasets"
    type: "dataset_registry"
    homepage: "https://huggingface.co/datasets"
    license: "per-resource"
    enabled: false
    status: "resource_review_required"
    intended_use: "metadata_inventory_then_per_resource_review"
    target_iso_codes:
      - "sbd"
      - "stj"
      - "sym"
    inventory_method: "Hugging Face Hub language:<iso> metadata query"
    content_download_enabled: false
    publication_approved: false
    training_approved: false
    notes:
      - "Chaque repo doit être étudié séparément avant téléchargement de contenu."
      - "Un tag de langue Hugging Face est une déclaration de métadonnées et ne garantit pas la qualité ni la pureté linguistique du dataset."
      - "La licence affichée sur le repo doit être vérifiée avec la provenance des données sources."

  webonary:
    name: "Webonary"
    type: "dictionary_platform"
    homepage: "https://www.webonary.org/"
    license: "rights_review_required"
    enabled: false
    status: "rights_review_required"
    intended_use: "reference_only_until_authorized"
