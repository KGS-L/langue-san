          - "San Maka"
          - "Maka Samo"
          - "Samo Maka"
          - "San du Sud"
      - variety: "matya"
        iso_639_3: "stj"
        glottocode: "maty1235"
        harvest_status: "harvested_units_csv_qa_passed"
        harvested_units_rows: 2743
        name_aliases:
          - "Matya Samo"
          - "Samo Matya"
          - "San Matya"
      - variety: "maya"
        iso_639_3: "sym"
        glottocode: "maya1281"
        harvest_status: "harvested_units_csv_qa_passed"
        harvested_units_rows: 2378
        name_aliases:
          - "Maya Samo"
          - "Samo Maya"
          - "Mayaa Samo"
          - "Samo Mayaa"
          - "San Maya"
          - "San Mayaa"
    notes:
      - "RefLex CLLD annonce des données téléchargeables et conserve les formes originales ainsi que les références de sources."
      - "La licence CC-BY-NC-SA-4.0 interdit l'usage commercial sans autorisation supplémentaire : ne pas mélanger automatiquement ces données à un futur corpus commercial."
      - "Le RAW reste local; l'attribution des sources amont doit être conservée."
      - "Le languages.csv réel contient 815 lignes et les colonnes Name, Family, Glottocode, Macroarea, Number of records in biggest source, Number of sources, Latitude, Longitude."
      - "Samo Matya / maty1235 est présent; languages.csv annonce 2764 fiches dans sa seule source, tandis que le DataTable /units exporte 2743 unités."
      - "Samo Maya / maya1281 est présent; languages.csv annonce 2384 fiches dans sa seule source, tandis que le DataTable /units exporte 2378 unités."
      - "Les écarts 2764→2743 (21) et 2384→2378 (6) sont conservés comme observations; aucune explication n'est inventée avant analyse de la structure RefLex."
      - "sout2844 / Southern Samo / San Maka n'a pas été trouvé dans l'index RefLex CLLD; ne pas lui attribuer un candidat approximatif."
      - "La vraie récolte lexicale passe par le DataTable /units découvert depuis la page langue, puis par son export CSV officiel limité à 10000 lignes."
      - "RAW récolté localement : stj=2743 lignes, sym=2378 lignes, 9 colonnes Original Form/Translation/Comment/POS/Source/Glottocode/Family/Latitude/Longitude."
      - "QA technique exécuté sur stj et sym : les deux sont technical_ok=true."

