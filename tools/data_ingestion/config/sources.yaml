version: 1

sources:
  asjp:
    name: "The ASJP Database"
    type: "structured_dataset"
    homepage: "https://asjp.clld.org/"
    release: "https://zenodo.org/records/16736409"
    version: "v21"
    repository: "https://github.com/lexibank/asjp/tree/v21"
    license: "CC-BY-4.0"
    enabled: true
    status: "approved_for_ingestion"
    intended_use: "lexical_reference"
    wordlists:
      - variety: "maka"
        iso_639_3: "sbd"
        asjp_id: "SOUTHERN_SAMO_SAN"
      - variety: "matya"
        iso_639_3: "stj"
        asjp_id: "SAMO_MATYA_2"
      - variety: "maya"
        iso_639_3: "sym"
        asjp_id: "MAYA_SAMO"

  reflex:
    name: "RefLex CLLD — Reference Lexicon of Africa"
    type: "structured_lexical_database"
    homepage: "https://reflex.clld.huma-num.fr/"
    version: "1.0"
    doi: "10.34847/nkl.e3cbkjzm"
    license: "CC-BY-NC-SA-4.0"
    enabled: true
    status: "harvested_noncommercial_research_pending_qa"
    intended_use: "lexical_reference_and_source_provenance"
    publication_approved: false
    training_approved: false
    commercial_use_approved: false
    endpoints:
      languages_csv: "https://reflex.clld.huma-num.fr/languages.csv"
      values: "https://reflex.clld.huma-num.fr/values"
      values_csv: "https://reflex.clld.huma-num.fr/values.csv"
      sources_csv: "https://reflex.clld.huma-num.fr/sources.csv"
    targets:
      - variety: "maka"
        iso_639_3: "sbd"
        glottocode: "sout2844"
        harvest_status: "not_found_in_languages_index"
        name_aliases:
          - "Southern Samo"
          - "Samo Southern"
          - "San Maka"
          - "Maka Samo"
          - "Samo Maka"
          - "San du Sud"
      - variety: "matya"
        iso_639_3: "stj"
        glottocode: "maty1235"
        harvest_status: "harvested_units_csv"
        harvested_units_rows: 2743
        name_aliases:
          - "Matya Samo"
          - "Samo Matya"
          - "San Matya"
      - variety: "maya"
        iso_639_3: "sym"
        glottocode: "maya1281"
        harvest_status: "harvested_units_csv"
        harvested_units_rows: 2378
        name_aliases:
          - "Maya Samo"
          - "Samo Maya"
          - "Mayaa Samo"
          - "Samo Mayaa"
          - "San Maya"
          - "San Mayaa"
    notes:
      - "RefLex CLLD annonce des données téléchargeables et conserve les formes originales ainsi que les références de sources."
      - "La licence CC-BY-NC-SA-4.0 interdit l'usage commercial sans autorisation supplémentaire : ne pas mélanger automatiquement ces données à un futur corpus commercial."
      - "Le RAW reste local; l'attribution des sources amont doit être conservée."
      - "Le languages.csv réel contient 815 lignes et les colonnes Name, Family, Glottocode, Macroarea, Number of records in biggest source, Number of sources, Latitude, Longitude."
      - "Samo Matya / maty1235 est présent; languages.csv annonce 2764 fiches dans sa seule source, tandis que le DataTable /units exporte 2743 unités."
      - "Samo Maya / maya1281 est présent; languages.csv annonce 2384 fiches dans sa seule source, tandis que le DataTable /units exporte 2378 unités."
      - "Les écarts 2764→2743 (21) et 2384→2378 (6) sont conservés comme observations; aucune explication n'est inventée avant analyse de la structure RefLex."
      - "sout2844 / Southern Samo / San Maka n'a pas été trouvé dans l'index RefLex CLLD; ne pas lui attribuer un candidat approximatif."
      - "La vraie récolte lexicale passe par le DataTable /units découvert depuis la page langue, puis par son export CSV officiel limité à 10000 lignes."
      - "RAW récolté localement : stj=2743 lignes, sym=2378 lignes, 9 colonnes Original Form/Translation/Comment/POS/Source/Glottocode/Family/Latitude/Longitude."
      - "Le QA technique RefLex doit être exécuté avant de considérer cette source terminée."

  ainsisoisje:
    name: "Ainsi sois-je — Dictionnaire Français / Samo"
    type: "web_dictionary"
    homepage: "https://ainsisoisje.com/"
    resource: "https://ainsisoisje.com/dictionnaire-samo-francais/"
    license: "All Rights Reserved"
    enabled: false
    status: "rights_review_required"
    intended_use: "local_source_inventory_and_comparison_only"
    declared_entry_count: 126
    variety: "unknown"
    iso_639_3: null
    publication_approved: false
    training_approved: false
    notes:
      - "La page publique ne précise pas la variété Samo au niveau ISO."
      - "Aucune attribution automatique vers sbd, stj ou sym."
      - "Le RAW reste local tant que les droits de réutilisation ne sont pas clarifiés."

  huggingface:
    name: "Hugging Face datasets"
    type: "dataset_registry"
    homepage: "https://huggingface.co/datasets"
    license: "per-resource"
    enabled: false
    status: "resource_review_required"
    intended_use: "metadata_inventory_then_per_resource_review"
    target_iso_codes:
      - "sbd"
      - "stj"
      - "sym"
    inventory_method: "Hugging Face Hub language:<iso> metadata query"
    content_download_enabled: false
    publication_approved: false
    training_approved: false
    notes:
      - "Chaque repo doit être étudié séparément avant téléchargement de contenu."
      - "Un tag de langue Hugging Face est une déclaration de métadonnées et ne garantit pas la qualité ni la pureté linguistique du dataset."
      - "La licence affichée sur le repo doit être vérifiée avec la provenance des données sources."

  webonary:
    name: "Webonary"
    type: "dictionary_platform"
    homepage: "https://www.webonary.org/"
    license: "rights_review_required"
    enabled: false
    status: "rights_review_required"
    intended_use: "reference_only_until_authorized"
