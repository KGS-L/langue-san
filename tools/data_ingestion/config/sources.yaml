    version: "v21"
    repository: "https://github.com/lexibank/asjp/tree/v21"
    license: "CC-BY-4.0"
    enabled: true
    status: "approved_for_ingestion"
    intended_use: "lexical_reference"
    wordlists:
      - variety: "maka"
        iso_639_3: "sbd"
