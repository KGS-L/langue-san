  white: "blanc"
  who: "qui"
  woman: "femme"
  yellow: "jaune"
  you: "tu / vous"

notes:
  lie: "Sens lexical de type ‘lie down / be lying’, pas le verbe ‘mentir’."
  know: "Le concept anglais peut couvrir selon le contexte ‘savoir’ ou ‘connaître’."
  many: "Libellé français volontairement large : quantité élevée / nombreux."
  that: "Démonstratif ; le choix exact en français dépend du contexte grammatical."
  you: "Le français distingue tu/vous alors que le gloss anglais ‘you’ ne le précise pas."
  I: "Gloss pronominal ; ‘je’ en sujet, ‘moi’ dans d'autres contextes."
