version: 1
name: "ASJP controlled French glosses"
status: "project_controlled_gloss"

# Ces traductions servent uniquement à donner un libellé français contrôlé
# aux concepts ASJP. Elles ne constituent PAS encore des paires français→San
# validées linguistiquement pour l'entraînement.
#
# Le champ `notes` documente les concepts ambigus ou dont le sens ASJP doit
# être interprété avec prudence.

