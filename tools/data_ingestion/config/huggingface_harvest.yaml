version: 1

# Cibles Hugging Face autorisées pour une récolte locale technique.
# Cela ne signifie PAS que les données sont validées linguistiquement ou
# approuvées pour publication / entraînement ML.

text_subsets:
  - key: fineweb2_sbd
    repo_id: "HuggingFaceFW/fineweb-2"
    family: "fineweb2"
    config: "sbd_Latn"
    splits: ["train", "test"]
    iso_639_3: "sbd"
    variety: "maka"
    license: "odc-by"
    rights_status: "dataset_license_declared_upstream_provenance_preserved"
    enabled: true

  - key: finepdfs_sbd
    repo_id: "HuggingFaceFW/finepdfs"
    family: "finepdfs"
    config: "sbd_Latn"
    splits: ["train"]
    iso_639_3: "sbd"
    variety: "maka"
    license: "odc-by"
    rights_status: "dataset_license_declared_upstream_provenance_preserved"
    enabled: true

  - key: glotcc_sbd
    repo_id: "cis-lmu/GlotCC-V1"
    family: "glotcc"
    config: "sbd-Latn"
    splits: ["train"]
    iso_639_3: "sbd"
    variety: "maka"
    license: "cc0-1.0"
    rights_status: "dataset_license_declared_upstream_provenance_preserved"
    enabled: true

  - key: taxi1500_sbd
    repo_id: "cis-lmu/Taxi1500-RawData"
    family: "taxi1500"
    config: "sbd_Latn"
    splits: ["taxi1500"]
    iso_639_3: "sbd"
    variety: "maka"
    license: "source-specific-or-other"
    rights_status: "rights_review_required_local_research_only"
    domain: "religious_bible_text"
    local_only: true
    publication_approved: false
    training_approved: false
    enabled: true
    notes:
      - "7919 lignes récoltées localement avec reprise après rate-limit HTTP 429."
      - "Récolte locale acceptée pour inventaire/recherche malgré la licence de contenu non clarifiée."
      - "Ne pas committer, republier ou redistribuer le RAW tant que les droits amont ne sont pas clarifiés."
      - "Domaine biblique fortement biaisé : à conserver séparément des corpus généraux."

lexical_subsets:
  - key: chikhapo_stj_eng
    repo_id: "ec5ug/chikhapo"
    family: "chikhapo"
    configs: ["eng_stj", "stj_eng"]
    iso_639_3: "stj"
    variety: "matya"
    license: "mit"
    upstream_sources: ["PanLex", "GATITOS", "IDS"]
    rights_status: "upstream_source_provenance_review_required"
    local_only: true
    enabled: true

  - key: panlex_san
    repo_id: "lbourdois/panlex"
    family: "panlex_snapshot"
    config: "default"
    split: "train"
    iso_codes:
      sbd: "maka"
      stj: "matya"
      sym: "maya"
    filter_column: "639-3"
    license: "cc0-1.0"
    rights_status: "dataset_cc0_upstream_provenance_preserved"
    snapshot_date: "2024-01-01"
    local_only: true
    publication_approved: false
    training_approved: false
    enabled: true
    notes:
      - "Snapshot Hugging Face de PanLex : ~24,6M lignes, 6152 langues."
      - "Collecte ciblée via Dataset Viewer /filter : aucun téléchargement du CSV complet de 1,28 Go."
      - "Les lignes contiennent vocab, 639-3, nom anglais, var_code et nom de variante."
      - "Conserver var_code : il distingue les variantes internes PanLex et n'est pas un code ISO."
      - "La licence du snapshot est CC0, mais la provenance lexicale amont doit rester documentée."

blocked_or_deferred:
  - repo_id: "openbmb/DCAD-2000"
    reason: "License is declared as other; rights review required before harvest."
  - repo_id: "espnet/mms_ulab_v2"
    reason: "Unlabeled audio; defer to the future audio/ASR acquisition phase."
