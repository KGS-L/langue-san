name: Ressource linguistique
description: Signaler un dictionnaire, guide, mémoire, corpus ou autre ressource utile
title: "[Ressource]: "
labels: []
body:
  - type: input
    id: title
    attributes:
      label: Nom de la ressource
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: Auteur ou institution
  - type: input
    id: link
    attributes:
      label: Lien
  - type: input
    id: variety
    attributes:
      label: Variété San concernée
  - type: textarea
    id: value
    attributes:
      label: Ce que cette ressource peut apporter
    validations:
      required: true
  - type: textarea
    id: rights
    attributes:
      label: Licence ou droits connus
      description: Une ressource accessible en ligne n'est pas automatiquement libre de réutilisation.
